<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话平台</title>
    <script>
      // 首屏防闪：在 Vue 挂载之前先把主题写到 <html data-theme>。
      // 不做这一步的话，深色模式的用户会先看到一帧白屏再切过去。
      // 解析规则必须和 src/composables/useTheme.ts 保持一致。
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('ai-chat-settings') || '{}')
          var mode = saved.theme || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <meta name="description" content="基于 Vue 3 + Web Speech API 的 AI 对话平台">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
